openapi: 3.0.0
info:
  title: PharmacyAPI
  version: 1.0.0
  description: Manages pharmacy prescription queue
paths:
  /prescriptions/queue:
    get:
      summary: View prescription queue
      operationId: getQueue
      responses:
        "200":
          description: OK
  /prescriptions/{id}/fill:
    post:
      summary: Fill a prescription
      operationId: fillPrescription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
