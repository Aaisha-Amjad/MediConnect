openapi: 3.0.0
info:
  title: PharmacyAPI
  version: 1.0.0
  description: Pharmacy prescription queue and fulfillment API
servers:
  - url: http://pharmacy-service:5003
paths:
  /prescriptions/queue:
    get:
      summary: View prescription queue
      operationId: getQueue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /prescriptions/{id}/fill:
    post:
      summary: Fill prescription
      operationId: fillPrescription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
